<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISAAC MD BOT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-image: url("/assets/isaac-banner.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }
    .btn {
      width: 200px;
      padding: 0.8em 1.75em;
      background-color: blue;
      border-radius: 6px;
      border: .3px solid red;
      transition: .5s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      z-index: 1;
      font-weight: 300;
      font-size: 17px;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      text-transform: uppercase;
      color: red;
      margin-bottom: 24px;
    }
    .btn::after, .btn::before {
      content: '';
      display: block;
      height: 100%;
      width: 100%;
      transform: skew(90deg) translate(-50%, -50%);
      position: absolute;
      inset: 50%;
      left: 25%;
      z-index: -1;
      transition: .5s ease-out;
      background-color: brown;
    }
    .btn::before {
      top: -50%;
      left: -25%;
      transform: skew(90deg) rotate(180deg) translate(-50%, -50%);
    }
    .btn:hover::before { transform: skew(45deg) rotate(180deg) translate(-50%, -50%); }
    .btn:hover::after  { transform: skew(45deg) translate(-50%, -50%); }
    .btn:hover { color: #0E0E0E; }
    .btn:active { filter: brightness(.7); transform: scale(.98); }
  </style>
</head>
<body>
  <button onclick="window.location.href='/pair'" class="btn">𝗣𝗔𝗜𝗥 𝗖𝗢𝗗𝗘</button>
  <button onclick="window.location.href='/qr-page'" class="btn">𝗤𝗥 𝗖𝗢𝗗𝗘</button>
  <button onclick="window.open('https://github.com/kingplayboi/ISAAC')" class="btn">𝗜𝗦𝗔𝗔𝗖'𝗦 𝗥𝗘𝗣𝗢</button>
</body>
</html>
